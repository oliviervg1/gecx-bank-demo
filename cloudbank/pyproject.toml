[project]
name = "cloudbank-agent-workspace"
version = "0.1.0"
description = "Cloudbank multi-product GECX agent bundle, offline test suite, and evaluation tooling"
requires-python = ">=3.11"
dependencies = [
  "cxas-scrapi>=1.11.0,<2",
  "jsonschema>=4.23,<5",
  "protobuf>=5.28,<7",
  "pytest>=8.3,<10",
  "pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
