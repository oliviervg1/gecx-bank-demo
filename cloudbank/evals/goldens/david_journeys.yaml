conversations:
  - conversation: "david_mortgage_renewal_and_ee_vendor_journey"
    tags:
      - "P1"
      - "mortgage"
      - "everyday_banking"
    turns:
      - user: "Compare the fixed-rate renewal options on my mortgage."
        tool_calls:
          - action: route_banking_intent
            args:
              intent: "MORTGAGES"
              topic_hint:
                $matchType: "ignore"
          - action: transfer_to_agent
            args:
              agent: "mortgage_agent"
          - action: assist_mortgages
            args:
              query_type: "rate_options"
        agent:
          - "# silent"
          - "Compared with your November payment of £1,493.42 a month at 3.90%, the 2-year Fixed at 4.15% would be £1,511.05 a month (£17.63 more a month), while the 5-year Fixed at 3.75% would be £1,482.91 a month (£10.51 less a month). These figures are an indicative illustration only and not personalised mortgage advice."

      - user: "How much did I spend at EE this month?"
        tool_calls:
          - action: assist_mortgages
            args:
              switch_intent: "EVERYDAY_BANKING"
          - action: transfer_to_agent
            args:
              agent: "everyday_banking_agent"
          - action: assist_everyday_banking
            args:
              query_type: "vendor"
              vendor_name: "EE"
              period: "this_month"
        agent:
          - "# silent"
          - "At EE, you spent £45 across 1 payment in November, and £135 in total over the last three months."

      - user: "Thank you, goodbye."
        tool_calls:
          - action: assist_everyday_banking
            args:
              switch_intent: "FAREWELL"
          - action: end_session
            args:
              session_escalated: false
              reason: "CALL_COMPLETED"
        agent: "You are very welcome, David. Have a great rest of your day, and goodbye."
