conversations:
  - conversation: "sarah_overpayment_erc_cap_and_savings_journey"
    tags:
      - "P1"
      - "mortgage"
      - "allowance"
    turns:
      - user: "What happens if I overpay my mortgage by £400 a month?"
        tool_calls:
          - action: route_banking_intent
            args:
              intent: "MORTGAGES"
              topic_hint:
                $matchType: "ignore"
          - action: transfer_to_agent
            args:
              agent: "mortgage_agent"
          - action: assist_mortgages
            args:
              query_type: "overpayment_projection"
              monthly_overpayment: 400.0
        agent:
          - "# silent"
          - "Starting from November, overpaying £400.00 a month adds £4,800.00 in year one, which exceeds your remaining £3,650.00 fee-free allowance by £1,150.00 and could incur an early repayment charge. It would shave 2 years off your remaining term (down to 5 years and 6 months) and save £4,340.38 in total interest. These figures are an indicative illustration only and not personalised mortgage advice."

      - user: "What interest rate am I earning on my savings pot right now?"
        tool_calls:
          - action: assist_mortgages
            args:
              switch_intent: "SAVINGS"
          - action: transfer_to_agent
            args:
              agent: "savings_agent"
          - action: assist_savings
            args:
              query_type: "interest_rate"
        agent:
          - "# silent"
          - "In November, your Cloudbank Premier Saver earns 4.50% AER (4.41% gross compounded monthly). On your current £21,500.00 balance alone, that adds £967.55 in interest over 12 months."

      - user: "Lovely, thank you — goodbye."
        tool_calls:
          - action: assist_savings
            args:
              switch_intent: "FAREWELL"
        agent: "You are very welcome, Sarah. Have a great rest of your day, and goodbye."
