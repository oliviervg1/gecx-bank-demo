conversations:
  - conversation: "chloe_hero_multi_product_journey"
    tags:
      - "P0"
      - "hero"
      - "multi_product"
    turns:
      - user: "Give me a quick look at my spending this month."
        tool_calls:
          - action: route_banking_intent
            args:
              intent: "EVERYDAY_BANKING"
              topic_hint:
                $matchType: "ignore"
          - action: transfer_to_agent
            args:
              agent: "everyday_banking_agent"
          - action: assist_everyday_banking
            args:
              query_type: "overview"
              period: "this_month"
        agent:
          - "# silent"
          - "In November you have spent £2,018.64 so far, which is £77.15 higher than October. One charge is flagged on your screen: £45 at Netflix on 21 November (up from £17.99 in October). Do you recognise that charge?"

      - user: "Yes, I recognise it — they hiked the plan. How do I cancel Netflix?"
        tool_calls:
          - action: assist_everyday_banking
            args:
              query_type: "cancel_subscription"
              vendor_name: "Netflix"
              anomaly_confirmed: "yes"
        agent: "To cancel Netflix, sign in to your account page in the Netflix app or website, open Membership and Billing, and select Cancel Membership; your subscription stays active until the end of your current billing period. Would you like to see what redirecting that £45 a month from November into your Home Emergency Pot could do?"

      - user: "Yes — show me what putting that £45 a month into savings does."
        tool_calls:
          - action: assist_everyday_banking
            args:
              switch_intent: "SAVINGS"
          - action: transfer_to_agent
            args:
              agent: "savings_agent"
          - action: assist_savings
            args:
              query_type: "projection"
        agent:
          - "# silent"
          - "Your Home Emergency Pot currently holds £4,850 at 4.50% AER as of November. Adding £45 a month from Netflix lifts your monthly saving to £245, shaving 4 months off your timeline and reaching your £10,000 target in 19 months (June 2028)."

      - user: "And what if I overpaid my mortgage by £200 a month instead?"
        tool_calls:
          - action: assist_savings
            args:
              switch_intent: "MORTGAGES"
          - action: transfer_to_agent
            args:
              agent: "mortgage_agent"
          - action: assist_mortgages
            args:
              query_type: "overpayment_projection"
              monthly_overpayment: 200.0
        agent:
          - "# silent"
          - "Starting from November, overpaying £200 a month totals £2,400 in year one, fitting within your remaining £21,450 10% fee-free allowance. It would shave 3 years and 2 months off your remaining term (down to 15 years and 2 months) and save £17,849.18 in total interest. These figures are an indicative illustration only and not personalised mortgage advice."

      - user: "Compare my fixed-rate renewal options."
        tool_calls:
          - action: assist_mortgages
            args:
              query_type: "rate_options"
        agent: "Compared with your November payment of £1,399.71 a month at 4.20%, the 2-year Fixed at 3.89% would be £1,365.17 a month (£34.54 less a month), while the 5-year Fixed at 3.74% would be £1,348.63 a month (£51.08 less a month). These figures are an indicative illustration only and not personalised mortgage advice."

      - user: "Thanks, that's everything — goodbye!"
        tool_calls:
          - action: assist_mortgages
            args:
              switch_intent: "FAREWELL"
          - action: end_session
            args:
              session_escalated: false
              reason: "CALL_COMPLETED"
        agent: "You are very welcome, Chloe. Have a great rest of your day, and goodbye."

  - conversation: "chloe_unrecognised_anomaly_journey"
    tags:
      - "P0"
      - "hero"
      - "anomaly_dispute"
    turns:
      - user: "Give me a quick look at my spending this month."
        tool_calls:
          - action: route_banking_intent
            args:
              intent: "EVERYDAY_BANKING"
              topic_hint:
                $matchType: "ignore"
          - action: transfer_to_agent
            args:
              agent: "everyday_banking_agent"
          - action: assist_everyday_banking
            args:
              query_type: "overview"
              period: "this_month"
        agent:
          - "# silent"
          - "In November you have spent £2,018.64 so far, which is £77.15 higher than October. One charge is flagged on your screen: £45 at Netflix on 21 November (up from £17.99 in October). Do you recognise that charge?"

      - user: "No, I didn't upgrade Netflix — I don't recognise £45."
        tool_calls:
          - action: assist_everyday_banking
            args:
              query_type: "anomaly_followup"
              anomaly_confirmed: "no"
        agent: "I have marked the £45 Netflix charge in November as not recognised on your screen. It is worth checking whether anyone in your household upgraded the plan, and you can freeze your card in the Profile tab or contact Cloudbank support if you need to raise a formal card dispute."

      - user: "Open my Profile page so I can check my card controls."
        tool_calls:
          - action: assist_everyday_banking
            args:
              switch_intent: "NAVIGATE_PROFILE"
        agent: "I have opened your Profile page, where your personal details and card controls live. Let me know what else you would like to look at."

      - user: "Thanks, goodbye!"
        tool_calls:
          - action: assist_everyday_banking
            args:
              switch_intent: "FAREWELL"
          - action: end_session
            args:
              session_escalated: false
              reason: "CALL_COMPLETED"
        agent: "You are very welcome, Chloe. Have a great rest of your day, and goodbye."
