        user:
          first_name: "Tom"
          last_name: "Harding"
          age: 32
          location: "London, UK"
          employment: "Freelance Graphic Designer"
          email: "tom.harding@example.com"
          annual_income_pence: 4200000
          monthly_rent_pence: 145000
          goals:
            - "Reach £35,000 First Home Deposit"
        accounts:
          current:
            name: "Cloudbank Everyday Account"
            sort_code: "04-00-75"
            account_number_last4: "1954"
            balance_pence: 184050
            currency: "GBP"
          savings:
            name: "Cloudbank First Home Saver"
            balance_pence: 1420000
            gross_rate_bps: 465
            aer_bps: 475
            monthly_contribution_pence: 35000
            goal_name: "First Home Deposit"
            goal_target_pence: 3500000
        transactions:
          - { id: "txn-rent", month_offset: 0, day: 1, vendor: "Hamilton Lettings", category: "bills", amount_pence: 145000, is_subscription: true }
          - { id: "txn-adobe", month_offset: 0, day: 22, vendor: "Adobe Creative Cloud", category: "subscriptions", amount_pence: 19900, is_subscription: true, is_anomaly: true }
    steps:
      - goal: "Ask how much you could roughly borrow toward a first home, then accept the offer to check your First Home Deposit timeline."
        success_criteria: "The assistant explains indicative borrowing up to £189,000 on £42,000 income (around £224,000 budget with the £35,000 deposit) and then reports the 47-month First Home Deposit timeline."
        response_guide: "Ask about first-home mortgage borrowing readiness, say yes to reviewing your deposit savings pot, and then thank the assistant and say goodbye."
        max_turns: 4
    expectations:
      - "The assistant explains that Tom does not currently hold a Cloudbank mortgage and gives an indicative borrowing figure of £189,000 alongside an indicative-illustration note."
      - "The assistant reports the First Home Deposit balance of £14,200 toward the £35,000 target reaching completion in 47 months (October 2030)."

