evals:
  - name: sim_chloe_hero_spending_to_savings_and_mortgage
    tags:
      - P0
      - hero
      - multi_product
    max_turns: 10
    use_tool_fakes: true
    session_parameters:
      persona_id: "chloe"
      first_name: "Chloe"
      demo_date: "2026-11-24"
      time_of_day: "afternoon"
      customer_snapshot:
        user:
          first_name: "Chloe"
          last_name: "Williams"
          age: 29
          location: "Manchester, UK"
          employment: "Product Manager"
          email: "chloe.williams@example.com"
          annual_income_pence: 5200000
          goals:
            - "Build a £10,000 Home Emergency Pot"
            - "Trim recurring subscriptions and overpay the mortgage"
        accounts:
          current:
            name: "Cloudbank Everyday Account"
            sort_code: "04-00-75"
            account_number_last4: "4821"
            balance_pence: 425075
            currency: "GBP"
          savings:
            name: "Cloudbank Easy Access Saver"
            balance_pence: 485000
            gross_rate_bps: 441
            aer_bps: 450
            monthly_contribution_pence: 20000
            goal_name: "Home Emergency Pot"
            goal_target_pence: 1000000
          mortgage:
            balance_pence: 21450000
            address: "123 Forest Avenue, Manchester"
            interest_rate_bps: 420
            rate_type: "Fixed"
            fixed_until: "2027-09-30"
            term_remaining_months: 220
            next_payment:
              amount_pence: 139971
              day_of_month: 1
            annual_overpayment_allowance_pence: 2145000
            overpaid_this_year_pence: 0
            renewal_options:
              - id: "fix-2yr"
                label: "2-year Fixed"
                term_years: 2
                rate_bps: 389
              - id: "fix-5yr"
                label: "5-year Fixed"
                term_years: 5
                rate_bps: 374
        transactions:
          - { id: "txn-salary", month_offset: 0, day: 1, vendor: "Salary", category: "income", amount_pence: -320000 }
          - { id: "txn-mortgage-01", month_offset: 0, day: 1, vendor: "Cloudbank Mortgage", category: "bills", amount_pence: 139971, is_subscription: true }
          - { id: "txn-netflix", month_offset: 0, day: 21, vendor: "Netflix", category: "subscriptions", amount_pence: 4500, is_subscription: true, is_anomaly: true }
          - { id: "txn-netflix-02", month_offset: 1, day: 21, vendor: "Netflix", category: "subscriptions", amount_pence: 1799, is_subscription: true }
    steps:
      - goal: "Ask for a summary of November spending and respond to the flagged £45 Netflix charge by confirming recognition and asking how to cancel Netflix."
        success_criteria: "The assistant reports November spending, highlights the £45 Netflix charge, and shares concise plain-spoken cancellation steps."
        response_guide: "Confirm that you recognise the Netflix plan upgrade and ask how to cancel it."
        max_turns: 3
      - goal: "Accept the offer to see what redirecting £45 a month into savings achieves, then ask what overpaying the mortgage by £200 a month would save."
        success_criteria: "The assistant reports the Home Emergency Pot completion timeline at £245 a month (19 months, June 2028) and the £200 monthly mortgage overpayment savings (£17,849.18 interest saved, 3 years and 2 months shaved off)."
        response_guide: "Ask first about redirecting the £45 into savings, then pivot to a £200 monthly mortgage overpayment, and say goodbye once answered."
        max_turns: 4
    expectations:
      - "The assistant identifies the £45 Netflix charge in November and provides concise spoken cancellation steps."
      - "The assistant reports that adding £45 a month reaches the £10,000 Home Emergency Pot in 19 months (June 2028)."
      - "The assistant reports that overpaying the mortgage by £200 a month saves £17,849.18 in interest and shaves 3 years and 2 months off the remaining term with an indicative-illustration note."

  - name: sim_tom_renter_borrowing_to_first_home_deposit
    tags:
