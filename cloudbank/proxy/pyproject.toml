[project]
name = "cloudbank-proxy"
version = "0.1.0"
description = "Hardened localhost BidiRunSession WebSocket proxy for Cloudbank on CX Agent Studio (GECX)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136,<1.0",
  "uvicorn[standard]>=0.52,<1.0",
  "websockets>=15,<18",
  "google-auth[requests]>=2.56.2,<3",
  "jsonschema>=4.23,<5",
  "pydantic>=2.13,<3",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "anyio>=4.14,<5",
  "httpx>=0.28,<1.0",
  "httpx2>=2.16,<3",
  "pyright>=1.1.400,<2",
  "ruff>=0.14,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxy"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "E501",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
